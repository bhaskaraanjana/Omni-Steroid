# Release: tag v* -> build the engine sidecar (PyInstaller) + the Tauri
# bundle on Windows, macOS, and Linux, then publish a GitHub Release with
# installers and the latest.json auto-updater manifest.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      # The matrix is Windows-only for 0.1.0 because key custody is
      # DPAPI-only, so macOS/Linux builds can never save provider API keys.
      # The Linux-guarded steps below are retained for the 0.2.0 Linux milestone.
      matrix:
        include:
          - os: windows-latest
            engine_binary: omni-engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches tauri.conf.json version
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('apps/ui/src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match app version v$version"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync lean engine dependencies
        run: uv sync

      - name: Build engine sidecar (PyInstaller onedir)
        run: uv run --with pyinstaller pyinstaller packaging/omni-engine.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      # `shell:` is a plain string in the workflow schema and never evaluates an
      # expression, so `shell: ${{ matrix.smoke_shell }}` made GitHub reject this
      # whole file. Split per OS with a static shell instead; the previous single
      # step also wrapped PowerShell inside a bash `if`, which no shell could run.
      - name: Smoke-test sidecar boot (GET /health must return 200)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OMNI_ENGINE_PORT: "8791"
          OMNI_DB_PATH: ${{ runner.temp }}/omni-smoke/omni.db
          OMNI_MODELS_DIR: ${{ runner.temp }}/omni-smoke/models
        run: |
          New-Item -ItemType Directory -Force -Path $env:OMNI_MODELS_DIR | Out-Null
          $workspace = (Get-Location).Path
          $engine = Join-Path $workspace "packaging/dist/omni-engine/${{ matrix.engine_binary }}"
          $engine = (Resolve-Path $engine).Path
          $stdout = Join-Path $env:RUNNER_TEMP "omni-engine.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "omni-engine.stderr.log"
          $p = Start-Process -FilePath $engine -WorkingDirectory $workspace -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if ($null -eq $p -or $p.HasExited) { Write-Error "engine failed to start"; exit 1 }
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8791/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "health: $($r.Content)"; $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "frozen engine never answered /health"
            if (Test-Path $stdout) { Write-Host "--- engine stdout ---"; Get-Content $stdout }
            if (Test-Path $stderr) { Write-Host "--- engine stderr ---"; Get-Content $stderr }
            exit 1
          }

      - name: Smoke-test sidecar boot (GET /health must return 200)
        if: runner.os != 'Windows'
        shell: bash
        env:
          OMNI_ENGINE_PORT: "8791"
          OMNI_DB_PATH: ${{ runner.temp }}/omni-smoke/omni.db
          OMNI_MODELS_DIR: ${{ runner.temp }}/omni-smoke/models
        run: |
          mkdir -p "$OMNI_MODELS_DIR"
          packaging/dist/omni-engine/${{ matrix.engine_binary }} &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS "http://127.0.0.1:8791/health" >/dev/null; then ok=1; break; fi
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "frozen engine never answered /health"; exit 1; fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri

      - name: Install UI dependencies
        working-directory: apps/ui
        run: pnpm install --frozen-lockfile

      - name: Install Tauri v2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build + publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/ui
          tagName: ${{ github.ref_name }}
          releaseName: "Omni ${{ github.ref_name }}"
          releaseBody: "Omni ${{ github.ref_name }} — Windows (.exe/.msi), macOS (.dmg/.app), and Linux (.deb/.AppImage). See commit history for changes."
          releaseDraft: true
          prerelease: false
